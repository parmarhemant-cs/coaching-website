<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Coaching Registration</title>

  <!-- ============================= -->
  <!-- Google reCAPTCHA v2 Script    -->
  <!-- This loads captcha validation -->
  <!-- ============================= -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>

  <style>
    body { font-family: Arial; max-width: 500px; margin: 40px auto; }
    input, select, button { width: 100%; padding: 10px; margin: 8px 0; }
    button { background: #2c7be5; color: white; border: none; cursor: pointer; }
    button:disabled { background: gray; }
    .hidden { display:none; }
  </style>
</head>

<body>

<h2>Course Registration</h2>

<form id="regForm">

  <!-- Name -->
  <input type="text" name="name" placeholder="Full Name" required>

  <!-- Email -->
  <input type="email" name="email" placeholder="Email" required>

  <!-- Phone -->
  <input type="tel" name="phone" placeholder="Phone Number" required>

  <!-- Course Dropdown -->
  <select name="course" required>
    <option value="">Select Course</option>
    <option value="JEE">JEE</option>
    <option value="NEET">NEET</option>
  </select>

  <!-- ===================================== -->
  <!-- Honeypot Field (Spam Trap)            -->
  <!-- Bots fill this automatically          -->
  <!-- Real users never see this field       -->
  <!-- ===================================== -->
  <input type="text" name="website" class="hidden">

  <!-- ============================= -->
  <!-- Google reCAPTCHA Checkbox     -->
  <!-- Replace YOUR_SITE_KEY         -->
  <!-- ============================= -->
  <div class="g-recaptcha" data-sitekey="6LeqWWwsAAAAAN7VMg1QxuIGOFgGsyJbknVIjvq8"></div>

  <button type="submit" id="submitBtn">Submit</button>

</form>

<p id="status"></p>

<script>
/* =====================================================
   CONFIGURATION SECTION
   ===================================================== */

/* Replace this with your latest deployed Apps Script URL */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw07XODIxC5KJ5d8JizDR4zobJqZRfId4N3CGkf6XF_Q5eWACwDD1eOyCD9aOu3WoXaGA/exec";

/* Rate limiting: 1 submission every 30 seconds */
const SUBMIT_DELAY = 30000;


/* =====================================================
   FORM SUBMISSION HANDLER
   ===================================================== */

const form = document.getElementById("regForm");
const status = document.getElementById("status");
const button = document.getElementById("submitBtn");

form.addEventListener("submit", async function(e) {
  e.preventDefault();

  /* ============================= */
  /* Honeypot Spam Protection      */
  /* If hidden field is filled     */
  /* it's a bot → block submission */
  /* ============================= */
  if (form.website.value !== "") {
    status.innerText = "Spam detected.";
    return;
  }

  /* ============================= */
  /* Rate Limiting Protection      */
  /* Prevent rapid repeat submits  */
  /* ============================= */
  const lastSubmit = localStorage.getItem("lastSubmit");
  if (lastSubmit && (Date.now() - lastSubmit < SUBMIT_DELAY)) {
    status.innerText = "Please wait before submitting again.";
    return;
  }

  /* ============================= */
  /* reCAPTCHA Validation          */
  /* Ensure user checked captcha   */
  /* ============================= */
  const captchaToken = grecaptcha.getResponse();
  if (!captchaToken) {
    status.innerText = "Please verify you are not a robot.";
    return;
  }

  button.disabled = true;
  status.innerText = "Submitting...";

  const formData = new FormData(form);
  formData.append("g-recaptcha-response", captchaToken);

  try {

    /* ============================= */
    /* Send Data to Google Apps     */
    /* Backend handles:             */
    /* - recaptcha verification     */
    /* - sheet writing              */
    /* - email sending              */
    /* - SMS sending (optional)     */
    /* ============================= */

    const response = await fetch(SCRIPT_URL, {
      method: "POST",
      body: formData
    });

    const result = await response.text();

    status.innerText = result;

    /* Save submission time for rate limit */
    localStorage.setItem("lastSubmit", Date.now());

    form.reset();
    grecaptcha.reset();

  } catch (error) {
    status.innerText = "Server connection error.";
  }

  button.disabled = false;
});
</script>

</body>
</html>
